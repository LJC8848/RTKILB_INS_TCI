# -----------------------------------------------------------------------------
# Real-time PPP (SRIF-free, RTKLIB-based) options for rtkrcv
# Target tree : I:\ION_build\RTKLIB-2.5.1
# Entry point : app\consapp\rtkrcv  ->  rtkrcv.exe -ini src\ppp_rt.conf
#
# Format rules verified against src/options.c (loadopts/str2opt/chop):
#   - one option per line,  KEY = VALUE
#   - value may be the enum NAME (ppp-kine) or its number; NAME is safer here
#     because this fork's enum numbers differ from 2.4.3 (see MODOPT below)
#   - everything after '#' is cut off -> never put '#' inside a value
#   - unknown KEY is reported on stderr and silently ignored
# -----------------------------------------------------------------------------

# ============================ 1. positioning mode ============================
# MODOPT in this fork (options.c:45):
#   0:single,1:dgps,2:kinematic,3:static,4:static-start,5:movingbase,
#   6:fixed,7:ppp-kine,8:ppp-static,9:ppp-fixed
# NOTE: the shipped conf/rtk.conf comment says "6:ppp-kine" - it is STALE.
#       Always write the name, not the number.
pos1-posmode       =ppp-kine

# FRQOPT (options.c:46): 1:l1,2:l1+l2,3:l1+l2+l5,4:l1+l2+l5+l6
# ionosphere-free combination needs L2; PPP with L1 only is not usable.
pos1-frequency     =l1+l2

pos1-soltype       =forward      # real-time: forward only
pos1-elmask        =10           # (deg) 10 for global PPP, 15 for weak rx
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-snrmask_L1    =0,0,0,0,0,0,0,0
pos1-snrmask_L2    =0,0,0,0,0,0,0,0
pos1-snrmask_L5    =0,0,0,0,0,0,0,0

# IONOPT (options.c:48): 0:off,1:brdc,2:sbas,3:dual-freq,4:est-stec,5:ionex-tec,6:qzs-brdc
# WARNING: ppp.c is not pppp.c. model_iono() returns 0 for IONOOPT_OFF (ppp.c:966),
# so ppp_res() silently continues past every satellite (ppp.c:1006-1009) and prints
# "ppp (1) no valid obs data" -> ZERO solution rows. Use dual-freq (IF-LC) or est-stec.
pos1-ionoopt       =dual-freq

# TRPOPT (options.c:49): 0:off,1:saas,2:sbas,3:est-ztd,4:est-ztdgrad
# ZTD must be estimated for PPP. Use est-ztdgrad only with >=10 min arcs.
pos1-tropopt       =est-ztd

# EPHOPT (options.c:50): 0:brdc,1:precise,2:brdc+sbas,3:brdc+ssrapc,4:brdc+ssrcom
# ppp.c:433,716 branch on EPHOPT_SSRAPC / EPHOPT_SSRCOM -> SSR path is live.
#   brdc+ssrapc : broadcast eph + SSR orbit/clock, SSR also provides APC
#   precise     : needs SP3+CLK delivered as a FILE stream (see 5B)
pos1-sateph        =brdc+ssrapc

pos1-posopt1       =on           # satellite PCO correction (needs ANTEX)
pos1-posopt2       =on           # receiver PCO correction
pos1-posopt3       =on           # phase center variation: 0:off,1:on,2:precise
pos1-posopt4       =on           # solid earth tide
pos1-posopt5       =on           # relativistic clock correction
pos1-posopt6       =off
pos1-exclsats      =             # prn ... e.g. C02
pos1-navsys        =61           # 1:gps+2:sbas+4:glo+8:gal+16:qzs+32:bds

# ============================ 2. ambiguity resolution ========================
# Start float, then compare with continuous. ppp_ar.c provides ppp_ar1()/ppp_ar_part().
pos2-armode        =off          # 0:off,1:continuous,2:instantaneous,3:fix-and-hold
pos2-gloarmode     =off
pos2-bdsarmode     =off
pos2-arfilter      =on
pos2-arthres       =100
pos2-arthres1      =0.9999
pos2-arthres2      =0.25
pos2-arthres3      =0.1
pos2-arthres4      =0.05
pos2-arlockcnt     =0
pos2-minfixsats    =1
pos2-minholdsats   =1
pos2-mindropsats   =10
pos2-arelmask      =15
pos2-arminfix      =1
pos2-armaxiter     =1
pos2-elmaskhold    =0
pos2-aroutcnt      =5
pos2-maxage        =30           # (s) SSR age of validity
pos2-syncsol       =off
pos2-slipthres     =0.05         # (m) MW-lane slip threshold
pos2-dopthres      =1e-4
pos2-rejphase      =100          # (m)
pos2-rejcode       =100          # (m)
pos2-niter         =1
pos2-baselen       =0
pos2-basesig       =0
# !!! pos2-rejgdop DOES NOT EXIST in this fork (no entry in options.c sysopts[],
#     no field in prcopt_t). The shipped rtk.conf line "pos2-rejgdop = 30"
#     only produces "invalid option" on stderr.

# ============================ 3. output ======================================
out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-outvel         =off
out-timesys        =utc
out-timeform       =hms
out-timendec       =3
out-degform        =deg
out-outsingle      =off
out-maxsolstd      =0            # (m) 0 = no rejection
out-height         =ellipsoidal  # PPP results are ellipsoidal heights
out-geoid          =internal
out-solstatic      =all
out-outstat        =state        # for debugging: 1:state,2:residual

# ============================ 4. error model =================================
stats-eratio1      =100
stats-eratio2      =100
stats-errphase     =0.003        # (m)
stats-errphaseel   =0.003        # (m)
stats-errphasebl   =0           # (m/10km)
stats-errdoppler   =1           # (Hz)
stats-snrmax       =0
stats-errsnr       =0
stats-stdbias      =30           # (m) initial phase-bias std
stats-stdiono      =0.03         # (m)
stats-stdtrop      =0.3          # (m)
stats-prnaccelh    =1            # (m/s^2)
stats-prnaccelv    =1            # (m/s^2)
stats-prnbias      =0.0001
stats-prniono      =0.001
stats-prntrop      =0.0001
stats-prnpos       =0
stats-clkstab      =5e-12        # (s/s)

# ============================ 5. antenna / position ==========================
ant1-postype       =llh          # 0:llh,1:xyz,2:single,3:posfile,4:rinexhead,5:rtcm,6:raw
ant1-pos1          =0            # (deg)  <-- EDIT: rover latitude
ant1-pos2          =0            # (deg)  <-- EDIT: rover longitude
ant1-pos3          =0            # (m)    <-- EDIT: rover ellipsoidal height
ant1-anttype       =NONE
ant1-antdele       =0            # (m) E
ant1-antdeln       =0            # (m) N
ant1-antdelu       =0            # (m) U
ant2-postype       =llh          # 0:llh,1:xyz,2:single,3:posfile,4:rinexhead,5:rtcm ("off" is NOT a valid value -> options.c rejects it)
ant2-maxaveep      =0
ant2-initrst       =on

# ============================ 6. misc ========================================
misc-timeinterp    =off
misc-sbasatsel     =0
misc-rnxopt1       =
misc-rnxopt2       =
# pppopt is READ, not decoration. Verified consumers:
#   ppp.c:675      -GAP_RESION=nnnn
#   rtksvr.c:722   real-time applies corr_phase_bias() UNLESS "-DIS_FCB"
#   postpos.c:464  post-processing applies it ONLY IF "-ENA_FCB"
# => the same flag behaves inverted between the two paths. Real-time defaults
#    to ON. Set -DIS_FCB if your SSR stream carries no phase-bias message,
#    otherwise nav->ssr[].pbias stays 0 and the subtraction is a no-op.
misc-pppopt        =

# --------- 6A. files that rtkrcv really opens (verified in rtkrcv.c) ---------
# rtkrcv.c:390 readpcv(filopt.satantp) / :374 rcvantp / :478 dcb / :483 geoid / trace
file-satantfile    =ant\igs14.atx       # RELATIVE TO WORKING DIR = ...\RTKLIB-2.5.1\data
file-rcvantfile    =
file-staposfile    =
file-geoidfile     =
file-dcbfile       =
file-eopfile       =
file-blqfile       =
file-tempdir       =
file-geexefile     =
file-solstatfile   =
file-tracefile     =

# --------- 6B. inert in rtkrcv, only rnx2rtkp reads them ---------------------
# Verified: filopt.obs/nav/sp3/clk/erp are referenced ONLY in
#   app/consapp/rnx2rtkp/rnx2rtkp.c:219-223
# rtkrcv never reads them. Real-time products therefore MUST come through the
# inpstr* streams below, not through these keys.
file-ionofile      =
file-obsfile       =
file-navfile       =
file-sp3file       =
file-clkfile       =
file-erpfile       =

# ============================ 7. streams =====================================
# STR type (rtk.conf comment): 0:off,1:serial,2:file,3:tcpsvr,4:tcpcli,
#                              7:ntripcli,8:ftp,9:http
# stream1 = rover raw observations (MSM + broadcast eph, e.g. RTCM3 from the rx)
inpstr1-type       =ntripcli
inpstr1-path       =762270774@qq.com:2HYa1315335548!@ntrip.data.gnss.ga.gov.au:2101/ALBH00CAN0
inpstr1-format     =rtcm3        # 0:rtcm2,1:rtcm3,4:ubx,5:ss2,10:nvs,...
# mountpoint 2 (broadcast ephemeris) belongs in inpstr2-path, mountpoint 3 (SSR)
# in inpstr3-path. A line without '=' is reported by loadopts as
# "invalid option ..." (options.c:365) and does NOT set any option.
# stream2 = navigation. With sateph=brdc+ssrapc the broadcast ephemeris is
# needed. If the rover stream already carries 1019/1020/1042/... set this off
# and use misc-navmsgsel=rover instead.
inpstr2-type       =ntripcli
inpstr2-path       =762270774@qq.com:2HYa1315335548!@ntrip.data.gnss.ga.gov.au:2101/BCEP00BKG0
inpstr2-format     =rtcm3
inpstr2-nmeareq    =off
inpstr2-nmealat    =0
inpstr2-nmealon    =0

# stream3 = correction: SSR (RTCM 1057-1061 / 4073-4077, or B2B).
# rtcm3.c:1535+ decodes ssr1..ssr7 -> orbit, clock, code/phase bias, ura.
inpstr3-type       =ntripcli
inpstr3-path       =762270774@qq.com:2HYa1315335548!@ntrip.data.gnss.ga.gov.au:2101/SSRA00GFZ0
inpstr3-format     =rtcm3

outstr1-type       =file
outstr1-path       =pos\ppprt.pos
outstr2-type       =off
logstr1-type       =off
logstr2-type       =off
logstr3-type       =off

# 0:all,1:rover,2:base,3:corr  (rtkrcv.c:191 MSGOPT)
# MUST be "all": the broadcast ephemeris arrives on stream 2 (BCEP00BKG0), not on
# the rover stream. rtksvr.c:187/206/243 only accept eph/ION-UTC from a stream when
# navsel==0 || navsel==index+1. SSR is NOT gated by navsel (rtksvr.c:387).
misc-navmsgsel     =all
misc-svrcycle      =100          # (ms) processing cycle
misc-timeout       =10000
misc-reconnect     =10000
misc-nmeacycle     =5000
misc-buffsize      =32768
misc-proxyaddr     =
misc-fswapmargin   =30


# 2026-11-02 22:2x UTC+8 live check with this account (crc24-validated frame counts):
#   ALBH00CAN0  : 1006/1008/1033 + 1077/1087/1097 @1 Hz, NO 1019/1020 -> stream2 below is required
#   BCEP00BKG0  : 1019/1020/1041/1042/1043/1044/1045/1046 (broadcast eph, GPS+GLO+GAL+BDS+QZS)
#   SSRA00GFZ0  : 1057,1058,1059,1063,1064,1065,1240,1241,1242,1265,1266,1267 every 5 s (orbit+clock+bias)
#   SSRA00GAA0  : only 1059,1060 -> no orbit/clock, useless for PPP; and rtcm3.c:2783 maps 1060 to
#                 decode_ssr4 "combined orbit and clock" (rtcm3.c:1804), i.e. a phase-bias payload
#                 would be bit-misparsed. GFZ puts phase bias in 1265-1267 -> decode_ssr7, matches.
# ============================ 8. console =====================================
console-timetype   =gpst
console-soltype    =enu
console-solflag    =1
